name: Fundamental & Smart Money Mingguan

on:
  schedule:
    # Sabtu 23:17 UTC = Minggu 06:17 WIB. Bursa tutup, tidak berebut antrean
    # dengan run malam, dan hasilnya sudah dipakai run malam Senin.
    - cron: "17 23 * * 6"
  workflow_dispatch:
  push:
    branches: ["fase-*"]
    paths:
      - "usmarket/sec.py"
      - "usmarket/fundamental.py"
      - "usmarket/smartmoney.py"
      - "scripts/perbarui_fundamental.py"
      - "scripts/perbarui_smartmoney.py"
      - ".github/workflows/fundamental-mingguan.yml"

permissions:
  contents: write

# Grup sendiri, BUKAN satu grup dengan screening-malam.yml. GitHub hanya
# menyimpan satu run yang menunggu per grup dan membatalkan yang lebih lama:
# pada 15 Sep 2026 run terjadwal screening yang terlambat 2 jam memegang
# grup bersama, lalu push yang memicu dua workflow sekaligus membuat run
# fundamental dibatalkan tanpa pernah jalan. Dua workflow ini menulis folder
# berbeda (data/ vs hasil/), dan tabrakan push sudah ditangani langkah commit
# (ambil ulang remote, tulis ulang folder sendiri) — jadi grup terpisah aman.
concurrency:
  group: tulis-data
  cancel-in-progress: false

jobs:
  fundamental:
    runs-on: ubuntu-latest
    # Fundamental ± 4 menit. Smart money jauh lebih lama pada run pertama:
    # setiap dokumen Form 4 dalam 90 hari harus diunduh sekali (± 20.000
    # dokumen, 8 permintaan/detik ≈ 40 menit). Run berikutnya hanya mengambil
    # yang belum ada di data/insider.csv, jadi ± 5 menit.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      # ± 1.500 permintaan companyfacts (8/detik) + pencarian teks penuh EDGAR
      # + cadangan jumlah saham dari Yahoo untuk emiten multi-kelas. ± 4 menit.
      - name: Tarik laporan keuangan dari SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/perbarui_fundamental.py

      # Form 4 dari EDGAR (inkremental lewat data/insider.csv) + kepemilikan
      # institusi, short interest, dan estimasi analis dari Yahoo.
      #
      # Dilewati pada run yang dipicu push ke branch fase-*: menggabungkan
      # main ke branch fitur akan menjadwalkan unduhan Form 4 kedua yang
      # meng-commit data/ ke branch itu, dan pada run pertama itu 40 menit
      # sia-sia (15 Sep 2026: satu run harus dibatalkan manual). Untuk menguji
      # bagian ini dari branch, jalankan workflow-nya lewat workflow_dispatch.
      #
      # continue-on-error: kalau bagian ini gagal, laporan keuangan yang sudah
      # ditarik tetap di-commit — run malam masih punya empat faktor lamanya,
      # hanya tanpa smart money.
      - name: Tarik orang dalam, institusi, dan short interest
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/perbarui_smartmoney.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, tidak ada yang di-commit."
            exit 0
          fi
          pesan="Fundamental SEC $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
          git commit -m "$pesan"

          # Pola sama dengan screening-malam.yml: coba push tiga kali; saat
          # ditolak, ambil keadaan remote lalu tulis ulang berkas data/.
          simpan="$(mktemp -d)"
          cp -r data "$simpan/data"
          for percobaan in 1 2 3; do
            if git push; then
              echo "Berhasil didorong pada percobaan ke-$percobaan."
              exit 0
            fi
            git fetch origin "$GITHUB_REF_NAME" || { echo "Gagal mengambil keadaan remote." >&2; exit 1; }
            git reset --hard FETCH_HEAD
            cp -r "$simpan/data/." data/
            git add data/
            if git diff --cached --quiet; then
              echo "Run lain sudah menulis data yang sama persis."
              exit 0
            fi
            git commit -m "$pesan"
          done
          echo "Push tetap gagal setelah 3 percobaan." >&2
          exit 1
